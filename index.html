<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FAU Erlangen-Nürnberg interactive weekly schedule viewer and course manager for SS 2026">
  <title>FAU Schedule — SS 2026</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ═══ Toast Container ═══ -->
  <div id="toast-container"></div>

  <!-- ═══ Header ═══ -->
  <header id="app-header">
    <div class="header-inner">
      <div class="header-left">
        <div class="logo-mark">
          <svg viewBox="0 0 32 32" width="32" height="32"><rect rx="8" width="32" height="32" fill="var(--accent)"/><text x="16" y="22" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">F</text></svg>
        </div>
        <div class="header-title-group">
          <h1 id="page-title">My Schedule</h1>
          <p id="header-date" class="header-sub"></p>
        </div>
      </div>
      <div class="header-right">
        <span id="header-clock" class="live-clock"></span>
        <span id="next-class-badge" class="next-class-badge hidden"></span>
        <button id="theme-toggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
          <svg id="theme-icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg id="theme-icon-moon" class="hidden" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
        <button id="nav-toggle" class="btn-primary" onclick="togglePage()">
          <span id="nav-toggle-text">⚙️ Manage Courses</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ═══ Page 1: Schedule View ═══ -->
  <main id="schedule-page" class="page active">
    <!-- Day Tabs -->
    <nav id="day-tabs" class="day-tabs" role="tablist"></nav>

    <!-- Schedule Cards Container -->
    <section id="schedule-cards" class="cards-grid" aria-label="Course schedule"></section>

    <!-- Weekend Message -->
    <section id="weekend-msg" class="weekend-msg hidden">
      <div class="weekend-inner">
        <div class="weekend-emoji">🎉</div>
        <h2>No classes this weekend!</h2>
        <p>Enjoy your time off. Your Monday schedule is shown above.</p>
        <canvas id="confetti-canvas"></canvas>
      </div>
    </section>
  </main>

  <!-- ═══ Page 2: Course Manager ═══ -->
  <main id="manager-page" class="page">
    <div class="manager-header">
      <div class="manager-header-left">
        <h2>Course Manager</h2>
        <p class="manager-sub">Add, edit, or remove courses from your schedule</p>
      </div>
      <div class="manager-actions">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="course-search" placeholder="Search courses..." oninput="filterCourses()">
        </div>
        <button class="btn-accent" onclick="openForm()">+ Add New Course</button>
        <button class="btn-outline" onclick="exportCourses()" title="Export JSON">📤 Export</button>
        <label class="btn-outline import-label" title="Import JSON">📥 Import
          <input type="file" id="import-input" accept=".json" onchange="importCourses(event)" hidden>
        </label>
        <button class="btn-danger" onclick="confirmReset()">↩ Reset</button>
      </div>
    </div>
    <div id="manager-list" class="manager-list"></div>
  </main>

  <!-- ═══ Course Detail Modal ═══ -->
  <div id="detail-modal" class="modal-overlay hidden" onclick="closeDetailIfBackdrop(event)">
    <div class="modal-card detail-card" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeDetail()" aria-label="Close">✕</button>
      <div id="detail-content"></div>
    </div>
  </div>

  <!-- ═══ Course Form Modal ═══ -->
  <div id="form-modal" class="modal-overlay hidden" onclick="closeFormIfBackdrop(event)">
    <div class="modal-card form-card" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeForm()" aria-label="Close">✕</button>
      <h3 id="form-title">Add New Course</h3>
      <div id="course-form" class="course-form"></div>
    </div>
  </div>

  <!-- ═══ Confirm Dialog ═══ -->
  <div id="confirm-modal" class="modal-overlay hidden" onclick="closeConfirm()">
    <div class="modal-card confirm-card" onclick="event.stopPropagation()">
      <h3>Reset All Courses?</h3>
      <p>This will delete all your changes and restore the default schedule. This action cannot be undone.</p>
      <div class="confirm-actions">
        <button class="btn-outline" onclick="closeConfirm()">Cancel</button>
        <button class="btn-danger" onclick="resetCourses()">Yes, Reset</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
